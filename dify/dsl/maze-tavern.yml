app:
  description: 「迷宮酒館」— 由 Dify Chatflow 驅動的文字冒險遊戲主持人（DM）。 知識庫（規則卡／世界觀）與回合狀態、記憶日誌都落在
    OceanBase seekdb： Dify 以 seekdb 當向量庫存放知識庫，本專案的 session-state 服務 則把每個對話的狀態與記憶紀錄寫進同一個
    seekdb 實例。
  icon: 🕯
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 迷宮酒館
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.83@83fe34a84efc3ac71eedf98751b8dd0c41408f3e081ab781994dbdfe572a9593
    version: null
kind: app
site:
  chat_color_theme: null
  chat_color_theme_inverted: false
  copyright: null
  custom_disclaimer: ''
  default_language: en-US
  description: null
  icon: 🕯
  icon_background: '#FFEAD5'
  icon_type: emoji
  input_placeholder: null
  privacy_policy: null
  show_workflow_steps: true
  title: 迷宮酒館
  use_icon_as_answer_icon: false
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 迷宮酒館 session-state 服務的位址。Dify 跑在 Docker 時請用 http://host.docker.internal:8787；服務在同網段時改成該機器的
      IP。
    id: maze-service-url
    name: MAZE_SERVICE_URL
    selector:
    - env
    - MAZE_SERVICE_URL
    value: http://host.docker.internal:8787
    value_type: string
  features:
    file_upload: {}
    opening_statement: 門在你身後闔上，銅鈴只響了半聲。迷宮第七層的邊緣，唯一還開著的酒館「醉月」，今晚也照常營業。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我想跟館主老霍說話
    - 查看吧台下面是不是有暗格
    - 離開酒館，往迷宮走
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-get_context
      source: start
      sourceHandle: source
      target: get_context
      targetHandle: target
      type: custom
      zIndex: 0
    - id: get_context-retrieve_rules
      source: get_context
      sourceHandle: source
      target: retrieve_rules
      targetHandle: target
      type: custom
      zIndex: 0
    - id: retrieve_rules-dm
      source: retrieve_rules
      sourceHandle: source
      target: dm
      targetHandle: target
      type: custom
      zIndex: 0
    - id: dm-parse_state
      source: dm
      sourceHandle: source
      target: parse_state
      targetHandle: target
      type: custom
      zIndex: 0
    - id: parse_state-save_state
      source: parse_state
      sourceHandle: source
      target: save_state
      targetHandle: target
      type: custom
      zIndex: 0
    - id: save_state-answer
      source: save_state
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 玩家輸入
        title: Start
        type: start
        variables: []
      height: 90
